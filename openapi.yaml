components:
  schemas:
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        prefix:
          type: string
      required:
        - id
        - prefix
        - createdAt
        - expiresAt
      type: object
    ApiKeyList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ApiKeyList.json
          format: uri
          readOnly: true
          type: string
        keys:
          items:
            $ref: "#/components/schemas/ApiKey"
          nullable: true
          type: array
      required:
        - keys
      type: object
    CreateTodoEventRequest:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateTodoEventRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          type: string
        clientRequestId:
          minLength: 1
          type: string
        field:
          type: string
        to:
          type: string
        type:
          type: string
      required:
        - type
        - clientRequestId
      type: object
    CreateTodoRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateTodoRequest.json
          format: uri
          readOnly: true
          type: string
        assigneeId:
          type: string
        clientRequestId:
          minLength: 1
          type: string
        dueDate:
          format: date-time
          type: string
        priority:
          enum:
            - low
            - medium
            - high
            - urgent
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - clientRequestId
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          type: string
        hint:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorEnvelope.json
          format: uri
          readOnly: true
          type: string
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    Me:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Me.json
          format: uri
          readOnly: true
          type: string
        active:
          type: boolean
        handle:
          type: string
        role:
          type: string
      required:
        - handle
        - role
        - active
      type: object
    Todo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Todo.json
          format: uri
          readOnly: true
          type: string
        assigneeHandle:
          nullable: true
          type: string
        assigneeId:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        dueDate:
          format: date-time
          nullable: true
          type: string
        id:
          type: string
        priority:
          enum:
            - low
            - medium
            - high
            - urgent
          nullable: true
          type: string
        status:
          enum:
            - open
            - in_progress
            - done
            - closed
          type: string
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - status
        - assigneeId
        - assigneeHandle
        - priority
        - dueDate
        - createdBy
        - createdAt
        - updatedAt
      type: object
    TodoEvent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoEvent.json
          format: uri
          readOnly: true
          type: string
        actorHandle:
          type: string
        actorId:
          type: string
        body:
          type: string
        clientRequestId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        payload:
          additionalProperties: {}
          type: object
        seq:
          format: int64
          type: integer
        todoId:
          type: string
        type:
          type: string
      required:
        - id
        - todoId
        - seq
        - actorId
        - actorHandle
        - type
        - clientRequestId
        - createdAt
      type: object
    TodoEventList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoEventList.json
          format: uri
          readOnly: true
          type: string
        events:
          items:
            $ref: "#/components/schemas/TodoEvent"
          nullable: true
          type: array
      required:
        - events
      type: object
    TodoList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoList.json
          format: uri
          readOnly: true
          type: string
        todos:
          items:
            $ref: "#/components/schemas/Todo"
          nullable: true
          type: array
      required:
        - todos
      type: object
    UpdateTodoRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateTodoRequest.json
          format: uri
          readOnly: true
          type: string
        clientRequestId:
          minLength: 1
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - clientRequestId
      type: object
info:
  title: my-template API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/keys:
    get:
      description: Lists the caller's own non-revoked keys (revoked_at IS NULL), regardless of expiry — an expired-but-unrevoked key still shows up so the caller can see it needs rotating (I9 is about the auth-time check, not this listing decision).
      operationId: listKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: List the caller's own non-revoked API keys.
  /api/v1/keys/{id}:
    delete:
      description: Sets revoked_at. Owner-scoped, same 404 rule as every other owner-scoped resource on this surface (I3). There is deliberately no POST /api/v1/keys — issuance is CLI-only (cmd/issue-key).
      operationId: revokeKey
      parameters:
        - description: The API key's own id.
          in: path
          name: id
          required: true
          schema:
            description: The API key's own id.
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Revoke one of the caller's own API keys.
  /api/v1/me:
    get:
      description: "`me` is the only way an actor refers to itself — there is no endpoint that takes another actor's id."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Return the authenticated actor's own identity.
  /api/v1/todos:
    get:
      operationId: listTodos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: List every todo.
    post:
      operationId: createTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Create a todo, attributed to the caller.
  /api/v1/todos/{id}:
    get:
      operationId: getTodo
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Get a todo by id.
    patch:
      operationId: updateTodo
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Rename a todo.
  /api/v1/todos/{id}/events:
    get:
      operationId: listTodoEvents
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEventList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: This todo's own timeline.
    post:
      operationId: createTodoEvent
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoEventRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEvent"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Append an event to this todo's timeline (I15's single write path).
