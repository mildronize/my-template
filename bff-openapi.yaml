openapi: 3.0.3
info:
  title: my-template BFF API
  version: "1.0.0"
  description: >
    The BFF's session-authenticated JSON surface (milestone-3
    `.chief/milestone-3/_contract/API.md`), consumed only by the SPA
    running in the owner's own browser. Every request authenticates over
    a signed, HttpOnly session cookie, resolved by
    `internal/transport/bff`'s own session middleware
    (`bff.RequireJSONSession`) — not by anything in this spec: no
    `security` scheme is declared here on purpose, for the exact same
    reason `openapi.yaml`'s own header comment gives for that file: this
    spec's job is request/response *shape* validation (`gin-middleware`),
    not auth. A second, independent file from `openapi.yaml` on purpose
    (`_contract/API.md` "Two specs, not one") — the public API
    (Bearer-authenticated, agent-facing) and this BFF surface
    (session-authenticated, owner-facing browser only) are two disjoint
    proof-of-identity mechanisms by construction (I2/I12), and a single
    shared spec file would blur that boundary even though the code
    enforces it.

    Deliberately absent from this surface: `POST /todos` aside, there is
    no key issuance or rotation endpoint here (no `POST /keys`, no
    rotate) — same reasoning `openapi.yaml`'s own `/keys/{id}` comment
    gives: a raw key can't be returned safely over an HTTP response, so
    issuance and rotation stay CLI-only regardless of which surface is
    asking (`_contract/API.md`, `milestone-3/_goal/GOAL.md` Done-when 5).

    milestone-4 (`.chief/milestone-4/_contract/API.md`'s `bff` section):
    the todo endpoints below carry the new shared-collection shape (no
    more `done`; `status`/`assigneeId`/`priority`/`dueDate` instead), gain
    `POST`/`GET /todos/{id}/events` (I15's single write path, exposed on
    this surface too), and lose `DELETE /todos/{id}` entirely (mirrors
    `openapi.yaml`'s own removal, GOAL.md's "DELETE removed" decision).
    `status: closed` succeeds here — this is the owner's own surface
    (I18) — unlike the public API, where an agent caller is rejected.
    `/keys` below is unchanged by milestone-4/task-4; its semantics are
    replaced by a later task (I21).
servers:
  - url: /api/bff
paths:
  /me:
    get:
      operationId: getMe
      summary: Session-check endpoint backing the SPA's AuthGate-equivalent hook.
      description: >
        Same response shape as the public API's `GET /api/v1/me`,
        deliberately — one response shape for "who am I," regardless of
        which surface asked.
      responses:
        "200":
          description: The signed-in owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /todos:
    get:
      operationId: listTodos
      summary: List every todo.
      description: >
        milestone-4: todos are a shared collection (`_rules/_contract/
        DATA_MODEL.md`/`GOAL.md`'s Ownership model decision) — I3 no
        longer applies to this domain, on either surface. Returns every
        todo, created_at descending, unpaginated — same shape as
        `_rules/_contract/API.md`'s `GET /api/v1/todos`, not just the
        session owner's own.
      responses:
        "200":
          description: Every todo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTodo
      summary: Create a todo, attributed to the caller.
      description: >
        `createdBy` is always the resolved session owner — never accepted
        from the body (I1, same rule as the public API, different auth
        mechanism) — but is attribution only, never access-scoping
        (GOAL.md). `status` always starts `open`. The `created` event
        this produces is never client-specifiable as a distinct write
        (I16) — it only ever happens as this endpoint's own side effect.
        `clientRequestId` makes this idempotent the same way
        `POST .../events` is (I19). Calls
        `internal/domain/todo.Service.CreateTodo` directly — the same
        service instance and method the public API's handler calls
        (`_rules/_standard/ARCHITECTURE.md`'s shared-service-layer rule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
      responses:
        "201":
          description: The created todo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTodo
      summary: Get a todo by id.
      description: >
        milestone-4: every authenticated actor may read every todo (I3 no
        longer applies to this domain) — an unknown id is `not_found`,
        there is no "wrong owner" case left to produce it.
      responses:
        "200":
          description: The todo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTodo
      summary: Rename a todo.
      description: >
        milestone-4: the only field this endpoint still writes is
        `title` — `status`/`assigneeId`/`priority`/`dueDate` changes
        route through `POST .../events` instead (`status_changed`/
        `assigned`/`field_changed`), the single write path (I15/I18)
        those fields' permission/audit requirements actually need.
        `done` is gone entirely (replaced by `status`) — sending it is a
        `validation_error` (`hint: "done"`), not silently accepted and
        ignored. Internally still funnels through the same single write
        path as every other mutation (a `field_changed` event), hence
        `clientRequestId` (I19).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoRequest"
      responses:
        "200":
          description: The updated todo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /todos/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listTodoEvents
      summary: This todo's own timeline.
      description: >
        Oldest first — same shape and ordering as `_rules/_contract/
        API.md`'s `GET /api/v1/todos/{id}/events`. This todo's own
        timeline only; the cross-todo feed is `GET /api/bff/activity`,
        a separate endpoint (milestone-4/task-5).
      responses:
        "200":
          description: This todo's timeline, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTodoEvent
      summary: Append an event to this todo's timeline (I15's single write path).
      description: >
        One body shape per `type` — `commented` (`body`),
        `status_changed` (`to`), `assigned` (`to`, or `null` to
        unassign), `field_changed` (`field`, `to`) — `_contract/API.md`.
        `type: "created"` is rejected (`validation_error`): a `created`
        event only ever happens as `POST /todos`'s own side effect,
        never as a direct client-specifiable write (I16) — the same
        rejection applies to any other value this endpoint doesn't
        recognise, `created` included, not a special case.
        **`status: closed` succeeds on this surface** (I18 — this is the
        owner's own surface; contrast with the public API, where a
        Bearer-authenticated agent caller is rejected as `unauthorized`
        for the same write). Idempotent on `clientRequestId` (I19): a
        repeated id returns the original event and creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoEventRequest"
      responses:
        "201":
          description: The created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /activity:
    get:
      operationId: listActivity
      summary: The cross-todo activity feed — every event, across every todo, newest first.
      description: >
        `_contract/API.md`'s `GET /api/bff/activity`: a cursor over
        `todo_events` across every todo, newest first, joined to `todos`
        (title) and `users` (actor handle/role, so the caller can mark
        human vs agent). Owner-session only — mirrors my-task's
        `activity.list` (`~/gits/my-task/src/server/api/routers/
        activity.ts`), adapted from tRPC's `{limit, cursor: {createdAtMs,
        id}}` input shape to this surface's plain-JSON query-string
        convention: `limit` (default 30, same as my-task's own default;
        1-100 inclusive) plus `cursorCreatedAtMs`/`cursorId`, which must
        be supplied together or not at all (a lone one of the pair is a
        malformed cursor, `validation_error`). `nextCursor` in the
        response echoes the exact field names
        (`cursorCreatedAtMs`/`cursorId` on the way in, `createdAtMs`/`id`
        on the way out) so a client can round-trip it verbatim into the
        next page's query string. `nextCursor: null` means exhausted —
        mirrors `TaskQueryService.listActivity`'s own `hasMore` check
        (fetch `limit + 1` rows, an extra row present means there's a
        next page).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursorCreatedAtMs
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: cursorId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of the cross-todo feed, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys:
    get:
      operationId: listKeys
      summary: List the caller's own non-revoked API keys.
      description: >
        Same response shape as `_rules/_contract/API.md`'s
        `GET /api/v1/keys`. Calls `internal/identity.Service.ListAPIKeys`
        directly — same service, same method, session-resolved owner
        instead of Bearer-resolved actor.
      responses:
        "200":
          description: The caller's own non-revoked keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeKey
      summary: Revoke one of the caller's own API keys.
      description: >
        Sets `revoked_at`. Owner-scoped, same 404 rule. Calls
        `internal/identity.Service.RevokeAPIKey` directly. Deliberately
        no `POST /keys` and no rotate endpoint anywhere on this surface —
        see this file's `info.description`.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Me:
      type: object
      required: [handle, role, active]
      properties:
        handle:
          type: string
        role:
          type: string
        active:
          type: boolean
    Todo:
      type: object
      required:
        [
          id,
          title,
          status,
          assigneeId,
          priority,
          dueDate,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: >
            milestone-4: replaces `done`. Fixed enum, not an
            owner-editable table (GOAL.md).
          enum: [open, in_progress, done, closed]
        assigneeId:
          type: string
          nullable: true
          description: References a user (any role).
        priority:
          type: string
          nullable: true
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          description: >
            milestone-4: replaces `ownerId` — attribution only, never
            access-scoping (GOAL.md).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TodoList:
      type: object
      required: [todos]
      properties:
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
    TodoEvent:
      type: object
      required: [id, todoId, seq, actorId, type, clientRequestId, createdAt]
      properties:
        id:
          type: string
        todoId:
          type: string
        seq:
          type: integer
          format: int64
        actorId:
          type: string
        type:
          type: string
          description: >
            `created` | `commented` | `status_changed` | `assigned` |
            `field_changed` — the full read-side vocabulary
            (DATA_MODEL.md). `created` only ever appears here as a read
            value, never as something `POST .../events` accepted (I16).
        payload:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            JSON, shape depends on `type` — `{from, to}` pairs for
            `status_changed`/`assigned`, `{field, from, to}` for
            `field_changed`, `null` for `commented`.
        body:
          type: string
          nullable: true
          description: >
            The comment text for `type: commented`, `null` otherwise.
            Rendered client-side through a Markdown-to-React-elements
            path, never raw HTML (I8's mirror, GOAL.md).
        clientRequestId:
          type: string
        createdAt:
          type: string
          format: date-time
    TodoEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TodoEvent"
    ActivityActor:
      type: object
      required: [handle, role]
      description: >
        Carried so the UI can mark human vs agent (I20's sibling
        requirement, not itself an invariant — a rendering fact, not a
        safety one, `_contract/API.md`).
      properties:
        handle:
          type: string
        role:
          type: string
    ActivityTodoRef:
      type: object
      required: [id, title]
      description: The todo this event belongs to — enough to link/label it, not the full `Todo` shape.
      properties:
        id:
          type: string
        title:
          type: string
    ActivityCursor:
      type: object
      required: [createdAtMs, id]
      description: >
        Round-trips verbatim: the response's `nextCursor` and the
        request's `cursorCreatedAtMs`/`cursorId` query params name the
        same two values, mirrors my-task's own `{createdAtMs, id}` cursor
        object shape adapted to a flat query string.
      properties:
        createdAtMs:
          type: integer
          format: int64
        id:
          type: string
    ActivityItem:
      type: object
      required: [id, seq, type, actor, createdAt, todo]
      description: >
        One `todo_events` row, shaped for the feed — same underlying row
        `TodoEvent` (this file's own schema) represents on the per-todo
        timeline, so the two share a rendering component
        (`_goal/GOAL.md` Done-when 8): same `type`/`payload`/`body`
        meaning, plus `actor`/`todo` context a single-todo timeline
        doesn't need to repeat.
      properties:
        id:
          type: string
        seq:
          type: integer
          format: int64
        type:
          type: string
          description: Full read-side vocabulary, `created` included (a read value here, never a write one — I16).
        actor:
          $ref: "#/components/schemas/ActivityActor"
        payload:
          type: object
          additionalProperties: true
          nullable: true
        body:
          type: string
          nullable: true
          description: >
            The comment text for `type: commented`, `null` otherwise —
            same Markdown-to-React-elements rendering rule as `TodoEvent.
            body` (never raw HTML, I8's mirror).
        createdAt:
          type: string
          format: date-time
        todo:
          $ref: "#/components/schemas/ActivityTodoRef"
    ActivityFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        nextCursor:
          allOf:
            - $ref: "#/components/schemas/ActivityCursor"
          nullable: true
          description: Null when exhausted.
    ApiKey:
      type: object
      required: [id, prefix, createdAt, expiresAt]
      properties:
        id:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateTodoRequest:
      type: object
      additionalProperties: false
      description: >
        `additionalProperties: false` so a stray `done` (milestone-1/2/3's
        removed field) is a `validation_error`, not silently dropped
        (`_contract/API.md`). No `status` field, deliberately (mirrors
        the public API's own `CreateTodoRequest`) — every created todo
        starts `open` regardless of what a caller asks for.
      required: [title, clientRequestId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        assigneeId:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
          enum: [low, medium, high, urgent]
        dueDate:
          type: string
          format: date-time
          nullable: true
        clientRequestId:
          type: string
          minLength: 1
          description: >
            I19's idempotency key, on the `created` event this endpoint's
            own side effect writes — required, not optional, since
            `todo_events.client_request_id` is `NOT NULL UNIQUE` at the
            schema level for every row including `created` ones.
    UpdateTodoRequest:
      type: object
      additionalProperties: false
      description: >
        milestone-4: `title` only — see `updateTodo`'s own description
        for why `status`/`assigneeId`/`priority`/`dueDate` aren't here.
        `additionalProperties: false` so a stray `done` is a
        `validation_error`, not silently dropped.
      required: [title, clientRequestId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        clientRequestId:
          type: string
          minLength: 1
          description: >
            I19's idempotency key — this endpoint now funnels through
            the same single write path (I15) as every other mutation.
    CreateTodoEventRequest:
      type: object
      description: >
        One shape covers all four client-postable `type` values
        (`_contract/API.md`) — cross-field validation (e.g. `body`
        required for `commented`, `to` required for `status_changed`) is
        the handler's job, not this schema's, mirroring the public API's
        own `CreateTodoEventRequest`. `type` is deliberately an open
        string, not an `enum`, so `"created"` and any other unrecognised
        value reach the handler's own dispatch and are rejected there
        (I16) — the same path, not a special case for one string.
      required: [type, clientRequestId]
      properties:
        type:
          type: string
        clientRequestId:
          type: string
          minLength: 1
        body:
          type: string
          description: commented — the comment text.
        to:
          type: string
          nullable: true
          description: >
            status_changed — the target status (a `Todo.status` enum
            value; `closed` succeeds on this surface, I18). assigned —
            the target assignee's user id, or `null` to unassign.
        field:
          type: string
          description: >
            field_changed — which field `to` changes: `title` |
            `priority` | `dueDate`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            hint:
              type: string
  responses:
    BadRequest:
      description: The request violates a request-shape or validation rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Missing, expired, or wrong-role session cookie — same shape
        regardless of which check failed (I5). A behavior change from
        this package's own HTML `GET /` view: this JSON surface always
        answers 401, never a redirect (a `fetch` call can't follow a
        redirect the way a browser navigation does — the SPA's own
        AuthGate-equivalent hook is what turns a 401 into a redirect,
        client-side).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        Unknown id, or an id that exists but isn't the caller's (I3 —
        absence, not permission).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
