components:
  schemas:
    ActivityActor:
      additionalProperties: false
      properties:
        handle:
          type: string
        role:
          type: string
      required:
        - handle
        - role
      type: object
    ActivityCursor:
      additionalProperties: false
      properties:
        createdAtMs:
          format: int64
          type: integer
        id:
          type: string
      required:
        - createdAtMs
        - id
      type: object
    ActivityFeed:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ActivityFeed.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ActivityItem"
          nullable: true
          type: array
        nextCursor:
          $ref: "#/components/schemas/ActivityCursor"
      required:
        - items
      type: object
    ActivityItem:
      additionalProperties: false
      properties:
        actor:
          $ref: "#/components/schemas/ActivityActor"
        body:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        payload:
          additionalProperties: {}
          type: object
        seq:
          format: int64
          type: integer
        todo:
          $ref: "#/components/schemas/ActivityTodoRef"
        type:
          type: string
      required:
        - id
        - seq
        - type
        - actor
        - createdAt
        - todo
      type: object
    ActivityTodoRef:
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
      required:
        - id
        - title
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        handle:
          type: string
        id:
          type: string
        prefix:
          type: string
      required:
        - id
        - prefix
        - handle
        - createdAt
        - expiresAt
      type: object
    ApiKeyList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ApiKeyList.json
          format: uri
          readOnly: true
          type: string
        keys:
          items:
            $ref: "#/components/schemas/ApiKey"
          nullable: true
          type: array
      required:
        - keys
      type: object
    CreateTodoEventRequest:
      additionalProperties: true
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateTodoEventRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          type: string
        clientRequestId:
          minLength: 1
          type: string
        field:
          type: string
        to:
          type: string
        type:
          type: string
      required:
        - type
        - clientRequestId
      type: object
    CreateTodoRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateTodoRequest.json
          format: uri
          readOnly: true
          type: string
        assigneeId:
          type: string
        clientRequestId:
          minLength: 1
          type: string
        dueDate:
          format: date-time
          type: string
        priority:
          enum:
            - low
            - medium
            - high
            - urgent
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - clientRequestId
      type: object
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          type: string
        hint:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorEnvelope.json
          format: uri
          readOnly: true
          type: string
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    Me:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Me.json
          format: uri
          readOnly: true
          type: string
        active:
          type: boolean
        handle:
          type: string
        role:
          type: string
      required:
        - handle
        - role
        - active
      type: object
    Todo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Todo.json
          format: uri
          readOnly: true
          type: string
        assigneeHandle:
          nullable: true
          type: string
        assigneeId:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        dueDate:
          format: date-time
          nullable: true
          type: string
        id:
          type: string
        priority:
          enum:
            - low
            - medium
            - high
            - urgent
          nullable: true
          type: string
        status:
          enum:
            - open
            - in_progress
            - done
            - closed
          type: string
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - status
        - assigneeId
        - assigneeHandle
        - priority
        - dueDate
        - createdBy
        - createdAt
        - updatedAt
      type: object
    TodoEvent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoEvent.json
          format: uri
          readOnly: true
          type: string
        actor:
          $ref: "#/components/schemas/ActivityActor"
        actorId:
          type: string
        body:
          type: string
        clientRequestId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        payload:
          additionalProperties: {}
          type: object
        seq:
          format: int64
          type: integer
        todoId:
          type: string
        type:
          type: string
      required:
        - id
        - todoId
        - seq
        - actorId
        - actor
        - type
        - clientRequestId
        - createdAt
      type: object
    TodoEventList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoEventList.json
          format: uri
          readOnly: true
          type: string
        events:
          items:
            $ref: "#/components/schemas/TodoEvent"
          nullable: true
          type: array
      required:
        - events
      type: object
    TodoList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TodoList.json
          format: uri
          readOnly: true
          type: string
        todos:
          items:
            $ref: "#/components/schemas/Todo"
          nullable: true
          type: array
      required:
        - todos
      type: object
    UpdateTodoRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateTodoRequest.json
          format: uri
          readOnly: true
          type: string
        clientRequestId:
          minLength: 1
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - title
        - clientRequestId
      type: object
    User:
      additionalProperties: false
      properties:
        active:
          type: boolean
        handle:
          type: string
        id:
          type: string
        role:
          enum:
            - owner
            - agent
          type: string
      required:
        - id
        - handle
        - role
        - active
      type: object
    UserList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UserList.json
          format: uri
          readOnly: true
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          nullable: true
          type: array
      required:
        - users
      type: object
info:
  title: my-template BFF API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/bff/activity:
    get:
      description: A cursor over todo_events across every todo, newest first, joined to todos (title) and users (actor handle/role). Owner-session only; there is no agent-facing equivalent on either surface.
      operationId: listActivity
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursorCreatedAtMs
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: cursorId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeed"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: The cross-todo activity feed — every event, across every todo, newest first.
  /api/bff/keys:
    get:
      description: "Every role='agent' user's non-revoked keys (revoked_at IS NULL), not just the session owner's own — the session owner never holds a key at all (role='owner' can't be issued one, I2). Regardless of expiry: an expired-but-unrevoked key still shows up so the owner can see it needs rotating."
      operationId: listKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: List every agent's non-revoked API keys (I21).
  /api/bff/keys/{id}:
    delete:
      description: Sets revoked_at. Not scoped to a "caller's own" key — there is no such thing on this owner-only surface (I2) — any agent's key id may be revoked, session-gated only.
      operationId: revokeKey
      parameters:
        - description: The API key's own id.
          in: path
          name: id
          required: true
          schema:
            description: The API key's own id.
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Revoke any agent's API key by id (I21).
  /api/bff/me:
    get:
      description: Same response shape as the public API's `GET /api/v1/me`, deliberately — one response shape for "who am I," regardless of which surface asked.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Session-check endpoint backing the SPA's AuthGate-equivalent hook.
  /api/bff/todos:
    get:
      operationId: listTodos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: List every todo.
    post:
      description: "`createdBy` is always the resolved session owner — never accepted from the body (I1, same rule as the public API, different auth mechanism) — but is attribution only, never access-scoping (GOAL.md). `status` always starts `open`."
      operationId: createTodo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Create a todo, attributed to the caller.
  /api/bff/todos/{id}:
    get:
      description: "milestone-4: every authenticated actor may read every todo (I3 no longer applies to this domain) — an unknown id is not_found, there is no \"wrong owner\" case left to produce it."
      operationId: getTodo
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Get a todo by id.
    patch:
      description: "milestone-4: the only field this endpoint still writes is title — status/assigneeId/priority/dueDate changes route through POST .../events instead."
      operationId: updateTodo
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Rename a todo.
  /api/bff/todos/{id}/events:
    get:
      description: Oldest first. This todo's own timeline only; the cross-todo feed is GET /api/bff/activity, a separate endpoint.
      operationId: listTodoEvents
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEventList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: This todo's own timeline.
    post:
      description: "**`status: closed` succeeds on this surface** (I18 — this is the owner's own surface; contrast with the public API, where a Bearer-authenticated agent caller is rejected)."
      operationId: createTodoEvent
      parameters:
        - description: The todo's own id.
          in: path
          name: id
          required: true
          schema:
            description: The todo's own id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoEventRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoEvent"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Append an event to this todo's timeline (I15's single write path).
  /api/bff/users:
    get:
      operationId: listUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: List every active user, either role (the assignee picker's data source).
