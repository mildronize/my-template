<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      TPL-1 milestone-3/task-3: real Google Fonts, replacing next/font's
      Manrope/Fraunces load (my-task's root layout.tsx, dropped entirely —
      Vite has no next/font equivalent). A <link> tag is the plain-web
      substitute; styles/fonts.css maps the loaded families onto the
      --font-manrope/--font-fraunces vars globals.css's @theme block
      already references.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
